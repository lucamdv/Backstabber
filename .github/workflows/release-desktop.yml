name: Publicar aplicativos atualizáveis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      APP_VERSION: 1.1.${{ github.run_number }}

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão automática
        run: npm version $env:APP_VERSION --no-git-tag-version

      - name: Preparar ícone Windows
        run: node desktop/prepare-windows-icon.cjs

      - name: Gerar instalador Windows
        run: >-
          npx electron-builder --win nsis --x64 --publish never
          --config.publish.provider=github
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}

      - name: Guardar pacote Windows
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            release/Backstabber-Windows-Setup.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      APP_VERSION: 1.1.${{ github.run_number }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão automática
        run: npm version "$APP_VERSION" --no-git-tag-version

      - name: Preparar ícone macOS
        run: node desktop/prepare-mac-icon.cjs

      - name: Gerar DMG universal
        run: >-
          npx electron-builder --mac --universal --publish never
          --config.publish.provider=github
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}

      - name: Guardar pacote macOS
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            release/Backstabber-macOS-universal.dmg
            release/Backstabber-macOS-universal.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.1.${{ github.run_number }}

    steps:
      - name: Reunir aplicativos
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Criar a versão pública
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ env.APP_VERSION }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Backstabber $APP_VERSION" \
              --notes $'Atualização automática do Backstabber.\n\n- Windows: baixe `Backstabber-Windows-Setup.exe`.\n- macOS: baixe `Backstabber-macOS-universal.dmg`.' \
              --latest
          fi

      - name: Enviar os downloads com repetição automática
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ env.APP_VERSION }}
        run: |
          upload_asset() {
            local file="$1"
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Upload de $file falhou; nova tentativa em $((attempt * 15)) segundos."
                sleep $((attempt * 15))
              fi
            done
            return 1
          }

          upload_asset release-assets/latest.yml
          upload_asset release-assets/Backstabber-Windows-Setup.exe.blockmap
          upload_asset release-assets/Backstabber-Windows-Setup.exe
          upload_asset release-assets/Backstabber-macOS-universal.dmg.blockmap
          upload_asset release-assets/Backstabber-macOS-universal.dmg
          upload_asset release-assets/latest-mac.yml
          upload_asset release-assets/Backstabber-macOS-universal.zip.blockmap
          upload_asset release-assets/Backstabber-macOS-universal.zip
