name: Publicar PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Montar PWA versionado
        env:
          BACKSTABBER_BUILD_ID: ${{ github.sha }}
        run: npm run build:web

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
